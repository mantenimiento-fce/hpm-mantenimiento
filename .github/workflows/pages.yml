# Genera el sitio de Mantenimiento (HPM, troubleshooting, indicadores) y lo publica en GitHub Pages en cada push a main.
name: Publicar Mantenimiento

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: pip install -r requirements.txt
      - run: python test_build.py
      - run: python build.py
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          ANDON_TOKEN: ${{ secrets.ANDON_TOKEN }}  # publicar CSV de ANDON desde el dashboard (queda visible en la página)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
